name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the PWA build emitted a service worker and manifest
        run: |
          test -f dist/sw.js || { echo "dist/sw.js missing"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "manifest missing"; exit 1; }
          grep -q "index.html" dist/sw.js || { echo "app shell not precached"; exit 1; }
